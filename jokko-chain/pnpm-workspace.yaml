# pnpm workspace for the Jokko Chain monorepo.
# Everything is rooted in this folder so the project can move to its own repository unchanged
# (see README.md → "Portability").
packages:
  - 'apps/*'
  - 'packages/*'

# --- Supply-chain hardening (docs/02-security.md, T4) ---------------------------------------
# Record exact versions; the lockfile is the source of truth and is reviewed in every PR.
saveExact: true
# Refuse to install on an unsupported Node version.
engineStrict: true
# Do not install versions published less than 24h ago: most malicious npm releases are caught
# and pulled within hours.
minimumReleaseAge: 1440
# pnpm 10 blocks dependency install scripts by default. Only these are allowed to run them,
# each one reviewed: esbuild (used by drizzle-kit) downloads its platform binary.
# Telemetry scripts are never allowed to run.
ignoredBuiltDependencies:
  - '@scarf/scarf'
onlyBuiltDependencies:
  - esbuild
  - '@swc/core'

# One @types/node version across the workspace (keeps vitest/vite from being installed twice).
overrides:
  '@types/node': '22.20.4'
