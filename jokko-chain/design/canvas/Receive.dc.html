<button type="button" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #2E4D36; background: #172B20; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700">BTC</button>
<button type="button" style="height: 38px; padding: 0 12px; border-radius: 19px; border: 1px solid #2E4D36; background: #172B20; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700">Plus</button>

<button type="button" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #2E4D36; background: #172B20; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700">Ethereum (ERC20)</button>
<button type="button" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #2E4D36; background: #172B20; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700">BNB Chain (BEP20)</button>
<button type="button" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #2E4D36; background: #172B20; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700">Solana</button>

<div style="margin: 18px auto 0; width: 220px; height: 220px; box-sizing: border-box; padding: 14px; border-radius: 24px; background: #FFFFFF">

</sc-for>

<div style="margin-top: 16px; padding: 12px 14px; border-radius: 16px; background: #122A1F; border: 1px solid #22402E; display: flex; align-items: center; gap: 10px">

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2C94C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>

<div style="flex-grow: 1"></div>
<button type="button" style="height: 56px; border-radius: 28px; border: 1px solid #2E4D36; background: #172B20; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" x2="12" y1="2" y2="15"></line></svg>Partager mon adresse</button>
<p style="margin: 10px 0 0; text-align: center; font-size: 12px; font-weight: 500; color: #93A59B">Un proche sur Jokko ? Il peut vous payer avec votre numéro.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var n = 25;
    var seed = 20260927;
    function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
    function finder(r, c) {
      var corners = [[0, 0], [0, n - 7], [n - 7, 0]];
      for (var i = 0; i < corners.length; i++) {
        var r0 = corners[i][0], c0 = corners[i][1];
        if (r >= r0 - 1 && r <= r0 + 7 && c >= c0 - 1 && c <= c0 + 7) {
          var rr = r - r0, cc = c - c0;
          if (rr < 0 || rr > 6 || cc < 0 || cc > 6) return 0;
          if (rr === 0 || rr === 6 || cc === 0 || cc === 6) return 1;
          if (rr >= 2 && rr <= 4 && cc >= 2 && cc <= 4) return 1;
          return 0;
        }
      }
      return -1;
    }
    var cells = [];
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        var f = finder(r, c);
        var on = f === -1 ? rnd() > 0.52 : f === 1;
        cells.push({ bg: on ? '#0B1A12' : '#FFFFFF' });
      }
    }
    return { cells: cells };
  }
}
</script>
