<span>{{home.label}}</span>

<a href="PayThreads.dc.html" aria-current="{{payments.current}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 52px; border-radius: 26px; text-decoration: none; font-size: 11px; font-weight: 700; background: {{payments.bg}}; color: {{payments.fg}}">

<span>{{payments.label}}</span>
</a>
<a href="Swap.dc.html" aria-current="{{swap.current}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 52px; border-radius: 26px; text-decoration: none; font-size: 11px; font-weight: 700; background: {{swap.bg}}; color: {{swap.fg}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3 4 7l4 4"></path><path d="M4 7h16"></path><path d="m16 21 4-4-4-4"></path><path d="M20 17H4"></path></svg>

</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","payments","swap","earn","more"],"default":"home"},"lang":{"editor":"enum","options":["fr","en"],"default":"fr"},"$preview":{"width":390,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active ?? 'home';
    var lang = this.props.lang ?? 'fr';
    var labels = {
      fr: { home: 'Accueil', payments: 'Paiements', swap: 'Échanger', earn: 'Gagner', more: 'Plus' },
      en: { home: 'Home', payments: 'Payments', swap: 'Swap', earn: 'Earn', more: 'More' }
    };
    var names = labels[lang] || labels.fr;
    function tab(id) {
      var on = active === id;
      return { bg: on ? '#3E6B47' : 'transparent', fg: on ? '#C9F17B' : '#C3D4C8', current: on ? 'page' : 'false', label: names[id] };
    }
    return { home: tab('home'), payments: tab('payments'), swap: tab('swap'), earn: tab('earn'), more: tab('more') };
  }
}
</script>
</body>
</html>
